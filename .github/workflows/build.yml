name: Build ImmortalWrt 24.10 - GX30

on:
  workflow_dispatch:
  push:
    branches: [openwrt-24.10]
    paths:
      - 'target/linux/ramips/dts/mt7621_gx30.dts'
      - 'target/linux/ramips/dts/mt7621_cudy_wr1300-v3.dts'
      - 'target/linux/ramips/image/mt7621.mk'
      - 'extra-feeds.conf'
      - 'extra-packages.list'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Update feeds
        run: |
          if [ -f extra-feeds.conf ] && [ -s extra-feeds.conf ]; then
            cat extra-feeds.conf >> feeds.conf.default
          fi
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          ./scripts/feeds install -a

      - name: Configure target (multi device)
        run: |
          # Two distinct Kconfig symbol namespaces exist for devices:
          #   * choice "Target Profile"      -> TARGET_<conf>_DEVICE_<dev>          (single device)
          #   * menu   "Target Devices"      -> TARGET_DEVICE_<conf>_DEVICE_<dev>   (multi device,
          #                                                                         depends on TARGET_MULTI_PROFILE)
          # The old config wrote CONFIG_TARGET_ramips_mt7621_DEVICE_gx30=y, which lives in the
          # single-select "Target Profile" choice together with cudy_wr1300-v3. A choice can only
          # hold one selection, so gx30 was silently dropped by `make defconfig` and only the
          # cudy_wr1300-v3 image was produced. Use TARGET_MULTI_PROFILE + TARGET_DEVICE_* instead.
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_gx30=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_cudy_wr1300-v3=y" >> .config
          if [ -f extra-packages.list ]; then
            grep -vE '^\s*#|^\s*$' extra-packages.list >> .config
          fi
          make defconfig

      - name: Verify device selection
        run: |
          fail=0
          for sym in \
            CONFIG_TARGET_MULTI_PROFILE \
            CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_gx30 \
            CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_cudy_wr1300-v3
          do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "::error::${sym} was not enabled by defconfig"
              fail=1
            fi
          done
          echo "--- selected devices ---"
          grep -E '^CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_' .config || true
          exit $fail

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gx30-firmware
          path: |
            bin/targets/ramips/mt7621/*gx30*
            bin/targets/ramips/mt7621/*cudy_wr1300-v3*
            bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
